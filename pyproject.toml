[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urbangrowth"
version = "0.1.0"
description = "Construction/infrastructure alt-data signal research platform"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "structlog>=23.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rioxarray>=0.15",
    "xarray>=2024.1",
    "dask[complete]>=2024.1",
    "h3>=3.7",
    "requests>=2.31",
    "aiohttp>=3.9",
    "httpx>=0.25",
    "yfinance>=0.2.31",
    "fredapi>=0.5.1",
    "pystac-client>=0.7.5",
    "planetary-computer>=1.0.0",
    "sentinelsat>=1.2.1",
    "streamlit>=1.28",
    "plotly>=5.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "ipykernel>=6.0",
    "jupyter>=1.0",
]

[project.scripts]
ug = "urbangrowth.cli:app"
urbangrowth = "urbangrowth.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/urbangrowth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
