# Exclusions: recipient name substrings that must NOT be matched to any ticker.
# Prevents false positives where a common word appears in an unrelated company name.
exclusions:
  - "granite telecommunications"   # telecom company, NOT GVA (Granite Construction)
  - "vulcan inc"                    # defense tech firm, NOT VMC (Vulcan Materials)
