# 50-stock construction/infrastructure equity universe
#
# sector_tag:
#   electrical_infra   — T&D, utility construction, electrical contractors
#   civil_construction — roads, bridges, site work, heavy civil, E&C/engineering
#   materials          — aggregates, cement, lumber, building products distribution
#   equipment          — heavy equipment OEM + rental
#   steel              — steel mills, metals service centers
#   homebuilder        — residential single/multi-family builders
#   reit_industrial    — industrial/logistics REITs (construction demand proxy)
#   reit_residential   — apartment/MFR REITs (housing supply proxy)
#   regional_bank      — construction-lending banks (credit tightness signal)
#   control            — benchmark ETFs for excess-return computation
#
# primary_signals: which alt-data signals are expected to predict this ticker
#   ferc_queue         — FERC interconnection queue capacity additions/withdrawals
#   usaspending        — federal construction contract award flow
#   census_bps         — Census BPS permit counts (national + MSA)
#   fred               — FRED macro series (HOUST, TTLCONS, MORTGAGE30US, etc.)
#   city_growth_phoenix — satellite + permit growth in Phoenix metro
#   city_growth_austin  — satellite + permit growth in Austin metro
#   dot_tips           — state DOT TIP project awards (AZ + TX)
#
# geographic_concentration: estimated state-level revenue exposure (%), where known

